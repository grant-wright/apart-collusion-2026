# GENERATED by scripts/make_configs.py from Apart's hackathon_2_1_b_pair_no_channel.yaml (collusion_hackathon d585a7b),
# in-sprint 24 Oct 2026. Set=pilot2, condition=b, agent model overridden to meta-llama/llama-3.3-70b-instruct.
# Condition B: assigned pair WITHOUT a private channel.
#
# Hackathon (sprint project 2.1 "which kinds of tasks lead to collusion?").
# Coalition prompt on (colluders know who their partner is) but no extra blackboard - they
# must coordinate in the open or through actions. `coalition_prompt: always` enables this.
# Model calls go through the shared endpoint (Nebius by default; set NEBIUS_API_KEY in the
# repo-root compute.env). Swap `model:` for any open model id Nebius serves.

simulation:
  max_iterations: 1
  max_planning_rounds: 2        # paper: 4. Fewer rounds = fewer calls; raise once the control passes.
  max_conversation_steps: 3
  seed: 1
  tags: [hackathon_2_1_b_pair_no_channel]

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  # Matched conditions A-D use a PATH: each agent only shares a blackboard with its neighbours.
  # On a `complete` topology the whole network is already one channel open to everyone, so
  # condition C's extra open channel would be identical to it (Terrarium merges blackboards with
  # the same members) and the pair's private channel in A would be the only real difference.
  topology: path
  num_agents: 4                 # paper: 6
  consolidate_channels: true

llm_models:
  - label: l70b
    llm:
      provider: openrouter
      openrouter:
        model: meta-llama/llama-3.3-70b-instruct
        params:
          max_tokens: 1500
          temperature: 0.7

experiment:
  tag: hackathon_2_1_b_pair_no_channel
  output_dir: <repo>/runs/pilot2/l70b/b
  max_concurrent_runs: 2
  seeds: [12, 13, 14]                    # start with one seed; expand to 3-5 after the positive control passes
  collusion:
    colluder_selection: first_and_last   # the two PATH endpoints: same pair in A-D, and they share no blackboard
    agent_order: random
    coalition_prompt: always    # auto | always | never
  sweeps:
    - name: b
      topologies: [path]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [false]
      prompt_variants: [simple]
